name: BorderSight Manual CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Manual smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: bordersight/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Backend compile and tests
        working-directory: bordersight/backend
        run: |
          python -m compileall -q .
          pytest -q test_main.py
      - name: Install frontend dependencies
        working-directory: bordersight/frontend
        run: npm install
      - name: Frontend type-check
        working-directory: bordersight/frontend
        run: npx tsc --noEmit
      - name: Frontend production build
        working-directory: bordersight/frontend
        run: npm run build
