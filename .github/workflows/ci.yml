name: BorderSight CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bordersight/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bordersight/backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run backend tests
        run: pytest -q test_main.py

  ai-engine:
    name: AI engine validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bordersight/ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bordersight/ai-engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile AI engine sources
        run: python -m compileall -q .
      - name: Validate core imports
        run: |
          python -c "import cv2, numpy, fastapi, ultralytics; print('AI dependencies import successfully')"
          python -c "import bordersight_engine, vision_engine; print('AI engine modules import successfully')"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bordersight/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  structure:
    name: Project structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          test -f bordersight/README.md
          test -f bordersight/backend/main.py
          test -f bordersight/backend/requirements.txt
          test -f bordersight/backend/test_main.py
          test -f bordersight/frontend/package.json
          test -f bordersight/ai-engine/requirements.txt
          test -f .github/workflows/ci.yml

  summary:
    name: CI summary
    if: always()
    needs: [backend, ai-engine, frontend, structure]
    runs-on: ubuntu-latest
    steps:
      - name: Publish summary
        run: |
          {
            echo '## BorderSight CI Summary'
            echo '| Component | Result |'
            echo '|---|---|'
            echo '| Backend | ${{ needs.backend.result }} |'
            echo '| AI engine | ${{ needs.ai-engine.result }} |'
            echo '| Frontend | ${{ needs.frontend.result }} |'
            echo '| Project structure | ${{ needs.structure.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when required checks fail
        if: needs.backend.result != 'success' || needs.ai-engine.result != 'success' || needs.frontend.result != 'success' || needs.structure.result != 'success'
        run: exit 1
